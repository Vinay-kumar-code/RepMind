name: Manual Build APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Variant (debug or release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
      run_tests:
        description: 'Run Unit Tests before building'
        required: true
        default: true
        type: boolean
      create_release:
        description: 'Publish as a GitHub Release'
        required: false
        default: false
        type: boolean
      release_tag:
        description: 'Release Tag (optional, e.g. v1.0.2 - used if Publish Release is checked)'
        required: false
        default: ''
        type: string

concurrency:
  group: manual-build-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  manual-build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Configure Environment
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          if [ -n "${{ secrets.MAPS_API_KEY }}" ]; then
            echo "MAPS_API_KEY=${{ secrets.MAPS_API_KEY }}" >> local.properties
          fi

      - name: Run Unit Tests
        if: inputs.run_tests == true || inputs.run_tests == 'true'
        run: ./gradlew testDebugUnitTest --stacktrace --no-daemon
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}

      - name: Build Android APK (${{ inputs.build_type }})
        run: |
          if [ "${{ inputs.build_type }}" = "release" ]; then
            ./gradlew assembleRelease --stacktrace --no-daemon
          else
            ./gradlew assembleDebug --stacktrace --no-daemon
          fi
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}

      - name: Prepare APK Artifacts
        run: |
          mkdir -p apk_output
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          BUILD_TYPE="${{ inputs.build_type }}"
          
          if [ "$BUILD_TYPE" = "release" ]; then
            FOUND_APK=$(find app/build/outputs/apk/release -type f -name "*.apk" | head -n 1)
          else
            FOUND_APK=$(find app/build/outputs/apk/debug -type f -name "*.apk" | head -n 1)
          fi
          
          if [ -z "$FOUND_APK" ] || [ ! -f "$FOUND_APK" ]; then
            echo "Error: No APK found after build!"
            exit 1
          fi
          
          echo "Found APK at: $FOUND_APK"
          cp "$FOUND_APK" "apk_output/RepMind-${BUILD_TYPE}-${SHORT_SHA}.apk"
          cp "$FOUND_APK" "apk_output/RepMind-${BUILD_TYPE}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RepMind-${{ inputs.build_type }}-apk
          path: apk_output/*.apk
          retention-days: 30

      - name: Prepare Release Metadata
        if: inputs.create_release == true || inputs.create_release == 'true'
        id: release_meta
        run: |
          TAG="${{ inputs.release_tag }}"
          if [ -z "$TAG" ]; then
            TAG="v1.0-manual-run${{ github.run_number }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "title=RepMind ${{ inputs.build_type }} ($TAG)" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: inputs.create_release == true || inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: apk_output/RepMind-${{ inputs.build_type }}.apk
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: ${{ steps.release_meta.outputs.title }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
